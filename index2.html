<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="css/styles1.css" />
    <script src="js/jquery-3.7.1.js"></script>
    <script>
        jQuery(document).ready(function($) {
            $("a>img").click(function(envent) {
                img = $(this).attr('src');
                $("#image > img").attr({
                    'src' : img
                })
                $("a>img").removeClass('actived');
                $(this).addClass('actived')
            })
        })
    </script>
</head>
<body>
    <div id="main">
        <div id="image">
            <img src="images/Fall-beautiful.jpg.jfif" alt="" >
        </div>
        <div id="thum">
            <ul>
                <li><a href="javascript:(0)">
                    <img src="images/Fall-beautiful.jpg.jfif" alt="" class="actived">
                </a></li>
                <li><a href="javascript:void(0)">
                    <img src="images/maxresdefault.jpg" alt="">
                </a></li>
                <li><a href="javascript:void(0)">
                    <img src="images/nature-spring-2014-11.jfif" alt="">
                </a></li>
                <li><a href="javascript:void(0)">
                    <img src="images/nature-wallpapers-11.jfif" alt="">
                </a></li>
                <li><a href="javascript:void(0)">
                    <img src="images/Nature-Warter-Wallpapers-20.jfif" alt="">
                </a></li>
                <li><a href="javascript:void(0)">
                    <img src="images/perma-glory.jfif" alt="">
                </a></li>
            </ul>
        </div>
    </div>
</body>
</html>
